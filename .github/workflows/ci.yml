name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test administration and packaging safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Validate policy rendering without credentials
        run: python3 scripts/admin/configure_repository.py --plan
      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

  toolchain:
    name: toolchain (${{ matrix.os }})
    needs: source-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: questos workspace
    steps:
      - name: Check out source into a path with spaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: questos workspace
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Linux tools
        if: runner.os == 'Linux'
        run: bash scripts/setup.sh --android --accept-android-sdk-license
      - name: Set up Windows tools
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\setup.ps1 --android --accept-android-sdk-license
      - name: Verify installed versions
        run: python scripts/dev.py doctor --android
      - name: Clean import, smoke run, Quest candidate export, and XR package inspection
        run: python scripts/dev.py export-android
      - name: Retain unsigned Quest candidate and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest2-p1-${{ matrix.os }}
          path: |
            questos workspace/build/questos-p1-unsigned.apk
            questos workspace/build/build-manifest.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  repository-checks:
    name: repository-checks
    needs: [source-checks, toolchain]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every source and platform check to pass
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
        run: test "$SOURCE_RESULT" = success && test "$TOOLCHAIN_RESULT" = success
